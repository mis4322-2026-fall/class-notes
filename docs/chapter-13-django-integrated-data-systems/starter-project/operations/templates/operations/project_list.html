<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>{{ title }}</title>
  </head>
  <body>
    <h1>{{ title }}</h1>
    <table>
      <thead>
        <tr>
          <th>Project Code</th>
          <th>Project Name</th>
          <th>Customer</th>
          <th>Status</th>
        </tr>
      </thead>
      <tbody>
        {% for project in projects %}
        <tr>
          <td>{{ project.project_code }}</td>
          <td>{{ project.name }}</td>
          <td>{{ project.customer.name }}</td>
          <td>{{ project.status }}</td>
        </tr>
        {% endfor %}
      </tbody>
    </table>
  </body>
</html>
